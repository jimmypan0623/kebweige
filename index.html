<!--登入畫面--> 
<form id="login" method="post" action="loginchk.php">   
    <h1>LOG IN</h1>
    <fieldset id="inputs">
        <input id="account" name="account" type="text" placeholder="Account"  autocomplete="account" autofocus required>   
        <input id="password" name= "password" type="password" autocomplete="current-password" placeholder="Password" required>
        <input id="validcode" name= "validcode" type="text" style="width:47%;"  placeholder="輸入右邊驗證碼" maxlength='5' required>	
		<input id="originrandom" name= "originrandom" type="text" style="width:47%;display:none;"  maxlength='5'  >	
        <img id="img1">  
		<img id="img2"> 
		<img id="img3">		 	 
		<img id="img4"> 	 
		<img id="img5"> 	
    </fieldset>
    <fieldset id="actions">
        <input type="submit" id="submit" value="Log in">  		
    </fieldset>    
	<script type="text/javascript">
	function blocksclose(event)  
    {	
		if (typeof event=="undefined"){
			event=window.event;
		}	
		var target=getEventTarget(event);
		var dropsheet=document.getElementById("myModal");
		dropsheet.style.display="none";       
		if (dropsheet!=null){		
		   dropsheet.parentNode.removeChild(dropsheet);  
		}   	 	
		return true;
    }   	
	</script>
</form>
